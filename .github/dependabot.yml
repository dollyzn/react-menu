version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      adonisjs:
        patterns: ['@adonisjs/*', '@japa/*', '@vinejs/*']
      nextjs-react:
        patterns: ['next', 'react', 'react-dom', '@types/react*', 'eslint-config-next']
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      adonisjs:
        patterns: ['@adonisjs/*', '@japa/*', '@vinejs/*']
      nextjs-react:
        patterns: ['next', 'react', 'react-dom', '@types/react*', 'eslint-config-next']
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Adonis 7 packages (@adonisjs/redis 10+, ally 6+, ...) need
      # @adonisjs/core 7; we are on 6. Upgrade them together, on purpose.
      - dependency-name: '@adonisjs/*'
        update-types: [version-update:semver-major]
      # TypeScript 7 is the native compiler; Adonis 6 tooling needs the 5.x API.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      adonisjs:
        patterns: ['@adonisjs/*', '@japa/*', '@vinejs/*']
      nextjs-react:
        patterns: ['next', 'react', 'react-dom', '@types/react*', 'eslint-config-next']
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Adonis majors move together with @adonisjs/core (one release line);
      # upgrade them all at once, on purpose, following the upgrade guide.
      - dependency-name: '@adonisjs/*'
        update-types: [version-update:semver-major]
      # TypeScript 7 is the native compiler; the Adonis assembler supports TS 5/6.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Lucid runs a query's preloads in parallel; pg 9 refuses concurrent
      # queries on one client (transactions). Upgrade together with Lucid.
      - dependency-name: pg
        update-types: [version-update:semver-major]
      # Types follow the Node runtime in .nvmrc (24); bump them together.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # @vercel/otel 2.3 takes the OpenTelemetry SDK 2.x / 0.2xx line only, and
      # SDK 2.x takes @opentelemetry/api below 1.10 (1.10 goes with SDK 3).
      # Move them all together once @vercel/otel supports SDK 3.
      - dependency-name: '@opentelemetry/api'
        versions: ['>=1.10.0']
      - dependency-name: '@opentelemetry/resources'
        versions: ['>=3.0.0']
      - dependency-name: '@opentelemetry/sdk-metrics'
        versions: ['>=3.0.0']
      - dependency-name: '@opentelemetry/sdk-trace-base'
        versions: ['>=3.0.0']
      - dependency-name: '@opentelemetry/sdk-logs'
        versions: ['>=0.300.0']
      - dependency-name: '@opentelemetry/api-logs'
        versions: ['>=0.300.0']
      - dependency-name: '@opentelemetry/instrumentation'
        versions: ['>=0.300.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

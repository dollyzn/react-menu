version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      adonisjs:
        patterns: ['@adonisjs/*', '@japa/*', '@vinejs/*']
      nextjs-react:
        patterns: ['next', 'react', 'react-dom', '@types/react*', 'eslint-config-next']
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Adonis majors move together with @adonisjs/core (one release line);
      # upgrade them all at once, on purpose, following the upgrade guide.
      - dependency-name: '@adonisjs/*'
        update-types: [version-update:semver-major]
      # TypeScript 7 is the native compiler; the Adonis assembler supports TS 5/6.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Lucid runs a query's preloads in parallel; pg 9 refuses concurrent
      # queries on one client (transactions). Upgrade together with Lucid.
      - dependency-name: pg
        update-types: [version-update:semver-major]
      # Types follow the Node runtime in .nvmrc (24); bump them together.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # Table 9 is a rewrite (useTable, features registry); migrate on purpose.
      - dependency-name: '@tanstack/react-table'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

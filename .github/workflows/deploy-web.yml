name: Deploy web to VPS

# Only on a published release (or by hand in the Actions tab): pushes to
# main no longer deploy. Needs the VPS_* secrets.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_KEY }}

      - name: Add VPS Host to Known Hosts
        run: |
          ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          ssh -p ${{ secrets.VPS_PORT }} -T ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -euo pipefail
            echo "Starting deployment..."
            
            # VPS_PATH deve apontar para o clone do monorepo (raiz)
            cd ${{ secrets.VPS_PATH }}

            # Atualizar o repositório para a versão sendo publicada
            echo "Pulling latest changes from repository..."
            # The release's tag (or the commit picked in a manual run).
            git fetch --tags origin
            git reset --hard ${{ github.event.release.tag_name || github.sha }}

            # Instalar dependências e construir o projeto
            echo "Installing dependencies and building the project..."
            corepack enable
            pnpm install --frozen-lockfile --filter @react-menu/web...
            pnpm --filter @react-menu/web build

            # Reiniciar a aplicação com PM2
            echo "Starting or restarting application with PM2..."
            pm2 startOrRestart ~/ecosystem.config.js

            echo "Deployment completed successfully!"
          EOF

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Non-secret values that let both apps boot in CI. Real secrets never live here.
env:
  NODE_ENV: test
  TZ: UTC
  # apps/api
  PORT: '3333'
  HOST: localhost
  LOG_LEVEL: warn
  APP_KEY: ci-only-app-key-not-a-secret-0123456789
  APP_URL: http://localhost:3333
  FRONTEND_URL: http://localhost:3000
  AUTH_COOKIE_NAME: session-token
  AUTH_COOKIE_ENABLED: 'true'
  ADMIN_USER: admin@example.com
  ADMIN_PASS: ci-admin-password
  DB_HOST: localhost
  DB_PORT: '5432'
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_DATABASE: jjpasteis-menu-test
  REDIS_HOST: localhost
  REDIS_PORT: '6379'
  DRIVE_DISK: fs
  LIMITER_STORE: memory
  HEALTH_CHECK_MONITORING_TOKEN: ci-health-token
  # apps/web
  NEXT_PUBLIC_BUILD_VERSION: ci
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_API_URL: http://localhost:3333/api/v1
  NEXT_PUBLIC_API_TIMEOUT: '60000'
  NEXT_PUBLIC_AUTH_COOKIE_NAME: session-token
  NEXT_PUBLIC_STORAGE_BASE_NAME: menu-app
  NEXT_PUBLIC_PAGE_SIZES: '[10, 20, 30, 40, 50]'

jobs:
  checks:
    name: Lint, typecheck and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        env:
          NODE_ENV: production

  test:
    name: API tests and e2e
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jjpasteis-menu-test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: API tests
        run: pnpm --filter @react-menu/api test

      - name: Create e2e database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE "jjpasteis-menu-e2e"'
      - name: Install Playwright browser
        run: pnpm --filter @react-menu/web exec playwright install --with-deps chromium
      - name: E2E tests
        run: pnpm test:e2e
        env:
          NODE_ENV: development
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker images and compose smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure the production stack
        run: |
          cat > .env <<ENV
          SITE_ADDRESS=:80
          PUBLIC_URL=http://localhost
          APP_KEY=$(openssl rand -base64 32)
          ADMIN_USER=admin@example.com
          ADMIN_PASS=ci-admin-password
          POSTGRES_PASSWORD=ci-postgres-password
          REDIS_PASSWORD=ci-redis-password
          HEALTH_CHECK_MONITORING_TOKEN=ci-health-token
          ENV
      - name: Build and start
        run: docker compose up -d --build
      - name: Smoke test through Caddy
        run: |
          for i in $(seq 1 60); do curl -fs -o /dev/null http://localhost/app/login && break; sleep 2; done
          curl -fsS -o /dev/null -w "web /app/login -> %{http_code}\n" http://localhost/app/login
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/v1/public/menu)
          echo "api /public/menu (no store yet) -> $code"; test "$code" = "404"
          docker compose exec -T api node ace db:seed
          curl -fsS -o /dev/null -w "api login -> %{http_code}\n" -X POST http://localhost/api/v1/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"admin@example.com","password":"ci-admin-password"}'
      - name: Logs
        if: failure()
        run: docker compose logs --tail 200

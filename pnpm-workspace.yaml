packages:
  - apps/*
  - packages/*

allowBuilds:
  '@firebase/util': false
  '@swc/core': true
  protobufjs: false
  sharp: true
  unrs-resolver: false

# Allowed before pnpm's minimum release age: ts-exec 1.5.2 fixes loader
# hooks under `node ace serve` (OpenTelemetry in dev). Can go after 2026-11-20.
minimumReleaseAgeExclude:
  - '@poppinss/ts-exec@1.5.2'

overrides:
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0

permissions:
  '@tanstack/react-table':
    skills: true

# Agent skills shipped by packages (approved above) are linked here, where
# Claude Code picks them up. Generated on install: not committed.
skills:
  dirs:
    - .claude/skills
